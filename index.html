<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đề kiểm tra thường xuyên Toán 12 | GV: Phạm Đoàn Trung Hiếu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --primary-border: #bfdbfe;
      --green-soft: #f0fdf4;
      --green-border: #86efac;
      --green-text: #15803d;
      --radius-lg: 16px;
      --radius-md: 12px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 12px 24px -6px rgba(15, 23, 42, 0.08), 0 4px 10px -4px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button, input {
      font-family: inherit;
    }

    .hero {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 55%, #2563eb 100%);
      color: #ffffff;
      padding: 28px 20px 32px;
      box-shadow: 0 4px 16px rgba(30, 58, 138, 0.2);
    }

    .hero-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .hero-logo {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: #ffffff;
      padding: 6px;
      object-fit: contain;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
    }

    .hero-text {
      min-width: 0;
      flex: 1;
    }

    .hero-school {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #dbeafe;
      margin-bottom: 4px;
    }

    .hero-title {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .hero-subtitle {
      margin: 6px 0 0;
      font-size: 0.94rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 20px 56px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
    }

    .filter-group {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--border-strong);
      background: var(--surface-muted);
      color: var(--text-secondary);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn[aria-pressed="true"] {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .search-input {
      width: 260px;
      max-width: 100%;
      padding: 8px 13px;
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      font-size: 0.88rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.14);
    }

    .exam-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .exam-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .exam-card.is-open:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-border);
    }

    .exam-card.is-upcoming {
      background: var(--surface-muted);
      opacity: 0.86;
    }

    .card-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .pill-term {
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--primary-border);
    }

    .pill-type {
      background: var(--bg);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .pill-live {
      background: var(--green-soft);
      color: var(--green-text);
      border: 1px solid var(--green-border);
    }

    .pill-soon {
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border-strong);
    }

    .card-title {
      margin: 0 0 6px;
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
    }

    .card-desc {
      margin: 0;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .card-meta {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-open {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 15px;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
      transition: background 0.15s ease;
    }

    .btn-open:hover {
      background: var(--primary-hover);
    }

    .btn-disabled {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 10px;
      background: #e2e8f0;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: default;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 30px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .site-footer {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 20px 32px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @media (max-width: 760px) {
      .hero {
        padding: 20px 16px 24px;
      }

      .hero-logo {
        width: 54px;
        height: 54px;
        border-radius: 12px;
      }

      .hero-title {
        font-size: 1.24rem;
      }

      .container {
        padding: 16px 14px 40px;
      }

      .exam-grid {
        grid-template-columns: 1fr;
      }

      .search-input {
        width: 100%;
      }
    }
  </style>
</head>

    (function () {
      'use strict';

      // =========================================================================
      // DANH SÁCH ĐỀ KIỂM TRA (Thầy/Cô chỉ cần sửa hoặc thêm dòng ở đây!)

      // =========================================================================
      const DANH_SACH_DE = [
        {
          tieude: 'Đề KTTX lần 3 — Môn Toán 12',
          hocky: 'HK1',
          nhom: 'Kiểm tra thường xuyên',

          mota: 'Khảo sát hàm số, tọa độ Oxyz, mẫu số liệu ghép nhóm.',

        },
        {
          tieude: 'Đề KTTX lần 4 — Môn Toán 12',
          hocky: 'HK1',
          nhom: 'Kiểm tra thường xuyên',
          thoigian: '45 phút',
          mota: 'Đề ôn tập và hướng dẫn giải từng bước sẽ cập nhật sau khi kiểm tra.',
          link: '',
          trangthai: 'sap_ra_mat'
        },
        {
          tieude: 'Đề kiểm tra Giữa Học kỳ 1',
          hocky: 'HK1',
          nhom: 'Kiểm tra định kỳ',
          thoigian: '90 phút',
          mota: 'Tổng hợp kiến thức trọng tâm nửa đầu Học kỳ 1.',
          link: '',
          trangthai: 'sap_ra_mat'
        },
        {
          tieude: 'Đề kiểm tra Cuối Học kỳ 1',
          hocky: 'HK1',
          nhom: 'Kiểm tra định kỳ',
          thoigian: '90 phút',
          mota: 'Tổng hợp kiến thức Học kỳ 1.',
          link: '',
          trangthai: 'sap_ra_mat'
        }
        // Mẫu thêm đề mới (xóa dấu // ở đầu các dòng dưới và điền thông tin):
        // ,{
        //   tieude: 'Đề KTTX lần 1 (HK2) — Môn Toán 12',
        //   hocky: 'HK2',
        //   nhom: 'Kiểm tra thường xuyên',
        //   thoigian: '45 phút',

        //   link: './sua_de_kttx1_hk2_toan12.html',
        //   trangthai: 'dang_mo'
        // }
      ];

      let activeTerm = 'ALL';
      let searchQuery = '';

      const gridEl = document.getElementById('examGrid');
      const searchEl = document.getElementById('searchInput');
      const filterBtns = document.querySelectorAll('.filter-btn');

      function renderCards() {
        gridEl.innerHTML = '';
        const q = searchQuery.trim().toLowerCase();

        const filtered = DANH_SACH_DE.filter((item) => {
          if (activeTerm !== 'ALL' && item.hocky !== activeTerm) return false;
          if (!q) return true;
          const haystack = `${item.tieude} ${item.nhom} ${item.mota} ${item.hocky}`.toLowerCase();
          return haystack.includes(q);
        });

        if (filtered.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = 'Chưa có đề nào phù hợp với bộ lọc hiện tại.';
          gridEl.appendChild(empty);
          return;
        }

        for (const item of filtered) {
          const isOpen = item.trangthai === 'dang_mo' && Boolean(item.link);
          const card = document.createElement('article');
          card.className = `exam-card ${isOpen ? 'is-open' : 'is-upcoming'}`;

          const top = document.createElement('div');

          const badges = document.createElement('div');
          badges.className = 'card-badges';

          const leftBadges = document.createElement('div');
          leftBadges.className = 'badge-group';

          const termPill = document.createElement('span');
          termPill.className = 'pill pill-term';
          termPill.textContent = item.hocky === 'HK2' ? 'Học kỳ 2' : 'Học kỳ 1';

          const typePill = document.createElement('span');
          typePill.className = 'pill pill-type';
          typePill.textContent = item.nhom;

          leftBadges.append(termPill, typePill);

          const statusPill = document.createElement('span');
          statusPill.className = `pill ${isOpen ? 'pill-live' : 'pill-soon'}`;
          statusPill.textContent = isOpen ? 'Đang mở' : 'Sắp cập nhật';

          badges.append(leftBadges, statusPill);

          const title = document.createElement('h2');
          title.className = 'card-title';
          title.textContent = item.tieude;

          const desc = document.createElement('p');
          desc.className = 'card-desc';
          desc.textContent = item.mota;

          top.append(badges, title, desc);

          const footer = document.createElement('div');
          footer.className = 'card-footer';

          const meta = document.createElement('span');
          meta.className = 'card-meta';
          meta.textContent = `Thời gian: ${item.thoigian}`;

          if (isOpen) {
            const linkBtn = document.createElement('a');
            linkBtn.className = 'btn-open';
            linkBtn.href = item.link;
            linkBtn.textContent = 'Mở đề & Xem lời giải →';
            footer.append(meta, linkBtn);
          } else {
            const soonBtn = document.createElement('span');
            soonBtn.className = 'btn-disabled';
            soonBtn.textContent = 'Chưa mở';
            footer.append(meta, soonBtn);
          }

          card.append(top, footer);
          gridEl.appendChild(card);
        }
      }

      filterBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          activeTerm = btn.dataset.term;
          filterBtns.forEach((b) =>
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false')
          );
          renderCards();
        });
      });

      searchEl.addEventListener('input', () => {
        searchQuery = searchEl.value;
        renderCards();
      });

      renderCards();
    })();
  </script>
</body>
</html>
